[package]
name = "jidr-ui"
description = "Jidr Slint GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
jidr-core.workspace = true
jidr-client.workspace = true
jidr-proto.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
png.workspace = true
tracing.workspace = true
dirs.workspace = true

[build-dependencies]
slint-build = "1.18.1"
serde_json.workspace = true

[dev-dependencies]
jidr-daemon.workspace = true
jidr-backend.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[features]
# Tests that need a running Android emulator (Linux KVM in CI, arm64 on the dev Mac).
emulator = []

[[example]]
name = "snapshot"
path = "examples/snapshot.rs"
