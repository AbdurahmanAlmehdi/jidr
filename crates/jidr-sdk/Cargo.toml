serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs.workspace = true
hex.workspace = true
sha2.workspace = true
sha1 = "0.11"
roxmltree = "0.21"
