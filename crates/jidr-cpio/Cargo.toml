[package]
name = "jidr-cpio"
description = "Ramdisk cpio (newc) reader/writer with gzip, lz4-legacy and xz support."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
# Byte-identical re-compression of SDK ramdisks needs the reference
# implementations: liblz4 HC (lz4 -l -12) and zlib deflate (gzip -n -6).
# miniz_oxide and zlib-rs produce different bytes (see log/devlog-c.md, 9b).
lz4 = "1.28"
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
liblzma = { version = "0.4", default-features = false, features = ["static"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[features]
# Tests that need a running Android emulator (Linux KVM in CI, arm64 on the dev Mac).
emulator = []
