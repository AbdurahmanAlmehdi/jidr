[package]
name = "jidr-helper"
description = "The rooted on-device helper (ADR-0003): its wire protocol, its server and the daemon's client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The `jidr-helper` binary runs on the Android guest. It is built for
# `aarch64-unknown-linux-musl` and `x86_64-unknown-linux-musl` by
# `cargo xtask helper` and must stay small: only serde, serde_json, sha2 and
# rustix. Everything the daemon needs is behind the `host` feature.
[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

# `host`: the daemon's side (push, start, `adb forward`, client).
jidr-core = { workspace = true, optional = true }
jidr-adb = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1", features = ["net", "process"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[features]
host = ["dep:jidr-core", "dep:jidr-adb", "dep:tokio", "dep:tracing"]
# Tests that need a running Android emulator (Linux KVM in CI, arm64 on an Apple Silicon Mac).
emulator = []

[[bin]]
name = "jidr-helper"
path = "src/bin/jidr-helper.rs"

[lints]
workspace = true
