[package]
name = "jidr-widgets"
description = "CommandProvider for sensors, phone, network, dev tools, screenshots, recording and snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
jidr-core.workspace = true
jidr-adb.workspace = true
jidr-backend.workspace = true
jidr-proto.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
dirs.workspace = true
png.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

# MP4/H.264 through AVFoundation, which encodes with VideoToolbox (D13).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "block2"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"

[dev-dependencies]
jidr-daemon.workspace = true
jidr-client.workspace = true
jidr-sdk.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[features]
# Tests that need a running Android emulator (Linux KVM in CI, arm64 on an Apple Silicon Mac).
emulator = []
