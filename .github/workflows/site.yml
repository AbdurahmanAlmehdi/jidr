name: Site

# Builds jidr.ly (site/) on every pull request that touches it, and deploys it
# to the Cloudflare Pages project `jidr` on every push to main that does. The
# project takes direct uploads, so this workflow is what publishes the site.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN   an API token with Account › Cloudflare Pages › Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the `jidr` Pages project
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/design/**
      - .github/workflows/site.yml
  pull_request:
    paths:
      - site/**
      - docs/design/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name=jidr --branch=main
          --commit-hash="$GITHUB_SHA" --commit-dirty=true
