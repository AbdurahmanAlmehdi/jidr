name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Full gate: fmt, clippy, tests, license-check.
  check:
    name: fmt, clippy, tests, license-check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: GUI build deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo xtask ci

  # Does this change touch anything but docs/, site/ or Markdown?
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!site/**'
              - '!**/*.md'

  # macOS compile + lint gate for macOS-only code (VideoToolbox, Slint's
  # macOS backend, bundling). Hosted macOS can't boot the emulator and queues
  # slower, so tests run on Linux; skipped when only docs/site/Markdown change.
  clippy-macos:
    name: clippy (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  emulator:
    # Emulator integration tests on Linux KVM with x86_64 images (D28).
    # The arm64 run happens on the dev Mac via `cargo xtask e2e-mac` before release.
    name: emulator tests (Linux KVM, API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: GUI build deps
        # `--workspace --features emulator` also builds the Slint crates.
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install emulator and x86_64 image (CI test context only)
        # CI runners are a test context: licenses are accepted here for the
        # ephemeral runner only. The product never pipes `yes` into sdkmanager (D8).
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "emulator" "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - name: Emulator tests
        env:
          JIDR_TEST_SDK: ${{ env.ANDROID_SDK_ROOT }}
          JIDR_TEST_IMAGE: system-images;android-${{ matrix.api }};google_apis;x86_64
          JIDR_TEST_API: ${{ matrix.api }}
        run: cargo nextest run --workspace --features emulator --no-tests=pass --test-threads 1
