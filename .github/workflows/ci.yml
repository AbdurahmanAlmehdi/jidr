name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: fmt, clippy, tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo xtask ci

  emulator:
    # Emulator integration tests on Linux KVM with x86_64 images (D28).
    # The arm64 run happens on the dev Mac via `cargo xtask e2e-mac` before release.
    name: emulator tests (Linux KVM, API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install emulator and x86_64 image (CI test context only)
        # CI runners are a test context: licenses are accepted here for the
        # ephemeral runner only. The product never pipes `yes` into sdkmanager (D8).
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "emulator" "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - name: Emulator tests
        env:
          JIDR_TEST_SDK: ${{ env.ANDROID_SDK_ROOT }}
          JIDR_TEST_IMAGE: system-images;android-${{ matrix.api }};google_apis;x86_64
          JIDR_TEST_API: ${{ matrix.api }}
        run: cargo nextest run --workspace --features emulator --no-tests=pass --test-threads 1
