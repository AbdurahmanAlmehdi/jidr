name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Full gate: fmt, clippy, tests, license-check.
  check:
    name: fmt, clippy, tests, license-check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: GUI build deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo xtask ci

  # Does this change touch anything but docs/, site/ or Markdown?
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!site/**'
              - '!**/*.md'

  # macOS compile + lint gate for macOS-only code (VideoToolbox, Slint's
  # macOS backend, bundling). Hosted macOS can't boot the emulator and queues
  # slower, so tests run on Linux; skipped when only docs/site/Markdown change.
  clippy-macos:
    name: clippy (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  emulator:
    # Emulator integration tests on Linux KVM with x86_64 images (D28).
    # The arm64 run happens on an Apple Silicon Mac via `cargo xtask e2e-mac` before release.
    # Skipped when only docs/site/Markdown change, like clippy-macos.
    name: emulator tests (Linux KVM, API ${{ matrix.api }}, ${{ matrix.shard.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 35]
        # Every emulator test boots its own device, so the tests are split
        # across four jobs per API level, balanced by measured run times
        # (about 8 minutes each). `rest` takes every binary the other shards
        # don't name, so a new `*_emulator` binary always runs; keep its
        # exclusion list in sync and move binaries out when it gets slow.
        shard:
          - name: daemon
            filter: binary(~pool_emulator) | binary(~budget_emulator) | binary(~hibernate_emulator) | binary(~resilience_emulator)
          - name: root
            filter: binary(~props_emulator) | binary(~magisk_emulator) | binary(~adb_emulator)
          - name: cacert, mcp, ui
            filter: binary(~cacert_emulator) | binary(agent_tasks) | binary(~player_emulator) | binary(~media_emulator)
          - name: rest
            filter: >-
              (binary(~_emulator) | binary(agent_tasks))
              - (binary(~pool_emulator) | binary(~budget_emulator) | binary(~hibernate_emulator) | binary(~resilience_emulator)
              | binary(~props_emulator) | binary(~magisk_emulator) | binary(~adb_emulator)
              | binary(~cacert_emulator) | binary(agent_tasks) | binary(~player_emulator) | binary(~media_emulator))
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Put temp files on the larger disk
        # Tests create their AVDs in temp dirs. ext4 can't make copy-on-write
        # clones, so the pool tests copy whole AVDs (about 5 GB each), and
        # after the SDK, the image and the build the root disk has ~3 GB left.
        # The runner's /mnt disk is much larger; use it when it has more room.
        run: |
          df -h / /mnt || true
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/tmp
            sudo chown "$USER" /mnt/tmp
            echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"
          fi
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: GUI build deps
        # `--workspace --features emulator` also builds the Slint crates.
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install emulator and x86_64 image (CI test context only)
        # CI runners are a test context: licenses are accepted here for the
        # ephemeral runner only. The product never pipes `yes` into sdkmanager (D8).
        # Twelve shard jobs download in parallel and Google's servers drop the
        # odd download ("Premature EOF"), so retry before failing the job.
        run: |
          yes | sdkmanager --licenses > /dev/null
          for attempt in 1 2 3; do
            sdkmanager "platform-tools" "emulator" "system-images;android-${{ matrix.api }};google_apis;x86_64" && exit 0
            echo "::warning::sdkmanager download failed (attempt $attempt of 3), retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Emulator tests
        # Only this shard's tests, all of which boot a device; the check job
        # already runs the offline tests. `--no-fail-fast` so one flaky test
        # doesn't hide the result of the ones after it. `--retries 1` because
        # hosted runners have 4 vCPUs and the emulator occasionally dies while
        # booting (a hung QEMU main loop); a test that passes on the retry is
        # reported as FLAKY in the log, so flakes stay visible.
        env:
          JIDR_TEST_SDK: ${{ env.ANDROID_SDK_ROOT }}
          JIDR_TEST_IMAGE: system-images;android-${{ matrix.api }};google_apis;x86_64
          JIDR_TEST_API: ${{ matrix.api }}
        run: >-
          cargo nextest run --workspace --features emulator --no-tests=pass --test-threads 1
          --no-fail-fast --retries 1 -E '${{ matrix.shard.filter }}'

  emulator-gate:
    # Branch protection requires one "emulator tests (Linux KVM, API N)" check
    # per API level. The emulator job is sharded (its checks carry a shard
    # suffix), so these report the result of all of its shards under the
    # required names. A matrix job's result covers every shard and API, so a
    # failure anywhere fails all three. Skipped emulator tests (docs-only
    # changes) pass.
    name: emulator tests (Linux KVM, API ${{ matrix.api }})
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api: [30, 33, 35]
    steps:
      - name: Emulator shards passed or were skipped
        run: |
          echo "emulator shards: ${{ needs.emulator.result }}"
          case "${{ needs.emulator.result }}" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
