name: Release

# Builds the arm64 DMG and the MCP bundle (.mcpb) for a release tag and
# uploads them, with SHA256SUMS.txt, to that tag's GitHub Release. Then it
# bumps the Homebrew cask in AbdurahmanAlmehdi/homebrew-tap and publishes
# server.json to the MCP Registry (GitHub OIDC, no secret). Called by release-please.yml when a release
# PR is merged; run it by hand (Actions › Release › Run workflow) to rebuild
# the DMG for an existing tag.
#
# With the Developer ID secrets the app gets a hardened-runtime signature and
# the DMG is signed, notarized and stapled (Phase 12b). Without them the DMG
# is ad-hoc signed and the run shows a warning (D32).
#
# Secrets:
#   MAC_DEVELOPER_ID_P12_BASE64    base64 of the Developer ID Application .p12
#   MAC_DEVELOPER_ID_P12_PASSWORD  the .p12 export password
#   MAC_NOTARY_KEY_P8_BASE64       base64 of an App Store Connect API key (.p8)
#   MAC_NOTARY_KEY_ID              that key's ID
#   MAC_NOTARY_ISSUER_ID           that key's issuer ID
#   HOMEBREW_TAP_TOKEN             fine-grained token with contents write on
#                                  AbdurahmanAlmehdi/homebrew-tap; without it
#                                  the cask step is skipped with a warning
#   CLOUDFLARE_DEPLOY_HOOK         the jidr Pages project's deploy hook URL;
#                                  rebuilds jidr.ly once the DMG is uploaded
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.sums.outputs.version }}
      dmg_sha256: ${{ steps.sums.outputs.dmg_sha256 }}
      mcpb_sha256: ${{ steps.sums.outputs.mcpb_sha256 }}
      signed: ${{ env.HAVE_SIGNING }}
    env:
      HAVE_SIGNING: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import the Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_KEY_P8_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in the certificate"; exit 1; }
          echo "JIDR_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, package and scan
        env:
          NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
        run: cargo xtask release --scan --out dist

      - name: Check the version matches the tag
        id: sums
        run: |
          version="$(cat dist/VERSION)"
          [ "v${version}" = "${{ inputs.tag }}" ] || { echo "::error::built ${version}, tag is ${{ inputs.tag }}"; exit 1; }
          {
            echo "version=${version}"
            echo "dmg_sha256=$(awk '/\.dmg$/ {print $1}' dist/SHA256SUMS.txt)"
            echo "mcpb_sha256=$(awk '/\.mcpb$/ {print $1}' dist/SHA256SUMS.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Gatekeeper check
        if: env.HAVE_SIGNING == 'true'
        run: packaging/macos/verify.sh dist/Jidr-*-arm64.dmg

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/Jidr-*-arm64.dmg dist/jidr-mcp-*.mcpb dist/SHA256SUMS.txt --clobber

      - name: Remove the signing keychain and the API key
        if: always() && env.HAVE_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

  homebrew:
    name: Homebrew cask
    needs: macos-arm64
    # Only notarized builds go to Homebrew and the MCP Registry.
    if: needs.macos-arm64.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Push Casks/jidr.rb to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.macos-arm64.outputs.version }}
          SHA256: ${{ needs.macos-arm64.outputs.dmg_sha256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the cask was not updated"
            exit 0
          fi
          [ -n "$SHA256" ] || { echo "::error::no DMG checksum"; exit 1; }
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/AbdurahmanAlmehdi/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@SHA256@/${SHA256}/" packaging/homebrew/jidr.rb > tap/Casks/jidr.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/jidr.rb
          git diff --cached --quiet && { echo "cask already at ${VERSION}"; exit 0; }
          git commit -m "jidr ${VERSION}"
          git push origin HEAD

  mcp-registry:
    name: MCP Registry
    needs: macos-arm64
    # The registry refuses a version it already has, so re-running a tag
    # fails here; the release assets are already uploaded by then.
    if: needs.macos-arm64.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Point server.json at this release's bundle
        env:
          VERSION: ${{ needs.macos-arm64.outputs.version }}
          SHA256: ${{ needs.macos-arm64.outputs.mcpb_sha256 }}
        run: |
          [ -n "$SHA256" ] || { echo "::error::no .mcpb checksum"; exit 1; }
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/jidr-mcp-${VERSION}-darwin-arm64.mcpb"
          jq --arg v "$VERSION" --arg u "$url" --arg s "$SHA256" \
            '.version = $v | .packages[0].identifier = $u | .packages[0].fileSha256 = $s' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Publish
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  site:
    name: Rebuild jidr.ly
    needs: macos-arm64
    runs-on: ubuntu-latest
    steps:
      # The site reads the newest release that has its DMG and checksums
      # (site/scripts/release.mjs); they're uploaded now, so rebuild it.
      - name: Call the Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK is not set; jidr.ly was not rebuilt"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
