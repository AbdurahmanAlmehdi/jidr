<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CliBlock — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap"></head>
<body style="margin:0;background:var(--jidr-color-surface-base)">
<div class="ds-prev"><div class="lp"><div class="cols" style="--n:2;align-items:center"><div class="stack" style="gap:10px"><h2 class="lp-h2" style="font-size:26px;line-height:32px">One line in CI</h2><div class="cli"><div class="ch"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5" /> <line x1="12" x2="20" y1="19" y2="19" /></svg><span>Terminal</span><span class="grow"></span><button class="btn btn-tertiary btn-sm" data-copy="jidr device create &quot;Pixel-ish 6.1&quot; --api 35 --root magisk --wait-boot"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg><span>Copy</span></button></div><pre><span class="pr">$ </span>jidr device create <span class="s">"Pixel-ish 6.1"</span> --api 35 --root magisk --wait-boot</pre></div></div><div class="dl"><button class="btn btn-primary btn-lg"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <polyline points="7 10 12 15 17 10" /> <line x1="12" x2="12" y1="15" y2="3" /></svg><span>Download for Mac</span></button><span class="c2" style="font-size:13px">macOS 14+ · Apple Silicon (arm64) · [size] MB</span><span class="sum">SHA-256 <code class="tn">[checksum]</code><button class="btn btn-tertiary btn-sm btn-icon" aria-label="Copy checksum"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg></button></span><span class="c3" style="font-size:12px">Or <code class="tn">brew install --cask jidr</code></span></div></div></div></div>
<script>
document.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){var t=b.getAttribute('data-copy'),l=b.querySelector('span');
function d(){if(l){var o=l.textContent;l.textContent='Copied';setTimeout(function(){l.textContent=o},1500)}}
try{navigator.clipboard.writeText(t).then(d,function(){})}catch(e){}})});
</script>
</body>
